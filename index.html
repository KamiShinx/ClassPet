<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ClassPet</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&family=Secular+One&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="egg-wrapper">
  <div class="ring"></div>
  <div class="shell">
    <div class="brand">CLASS-PET</div>

    <div class="bezel">
      <div class="lcd">
        <div class="lcd-vignette"></div>
        <div class="lcd-scanline"></div>
        <div class="tts-btn" id="ttsToggle" onclick="toggleTTS()" title="&#x05D4;&#x05E4;&#x05E2;&#x05DC; &#x05E7;&#x05E8;&#x05D9;&#x05D0;&#x05D4; &#x05D1;&#x05E7;&#x05D5;&#x05DC;">&#x1F507;</div>

        <div class="lcd-status">
          <span class="status-name" style="width:100%;text-align:center;">ClassPet</span>
        </div>

        <div class="lcd-body" style="justify-content:center;align-items:center;gap:20px;padding:20px;">
          <!-- Landing egg -->
          <div style="position:relative;width:80px;height:100px;">
            <div style="width:80px;height:100px;background:#fff;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;border:3px solid var(--lcd-dark);animation:eggJump 2s ease-in-out infinite;box-shadow:inset -4px -6px 12px rgba(0,0,0,0.1);position:relative;">
              <div style="position:absolute;top:14px;left:10px;width:14px;height:14px;background:var(--egg);border-radius:50%;opacity:0.8;"></div>
              <div style="position:absolute;bottom:18px;right:12px;width:10px;height:10px;background:var(--candy-blue);border-radius:50%;opacity:0.8;"></div>
              <div style="position:absolute;top:32%;left:50%;transform:translateX(-50%);font-size:0.8rem;color:var(--lcd-dark);font-family:monospace;">&#x25CF;&#x203F;&#x25CF;</div>
            </div>
          </div>

          <div style="text-align:center;">
            <div style="font-family:'Secular One',sans-serif;font-size:1.4rem;color:var(--lcd-dark);margin-bottom:4px;">&#x05D1;&#x05E8;&#x05D5;&#x05DB;&#x05D9;&#x05DD; &#x05D4;&#x05D1;&#x05D0;&#x05D9;&#x05DD;!</div>
            <div style="font-family:'Heebo',sans-serif;font-weight:700;font-size:0.85rem;color:var(--lcd-mid);">&#x05D1;&#x05D7;&#x05E8;&#x05D5; &#x05DE;&#x05D9; &#x05D0;&#x05EA;&#x05DD;</div>
          </div>

          <div style="display:flex;flex-direction:column;gap:12px;width:80%;">
            <div class="big-btn pink" id="btnStudent" onclick="goStudent()">&#x1F423; &#x05D0;&#x05E0;&#x05D9; &#x05EA;&#x05DC;&#x05DE;&#x05D9;&#x05D3;/&#x05D4;</div>
            <div class="big-btn blue" id="btnTeacher" onclick="goTeacher()">&#x1F4CB; &#x05D0;&#x05E0;&#x05D9; &#x05DE;&#x05D5;&#x05E8;&#x05D4;/&#x05D4;</div>
          </div>
        </div>
      </div>
    </div>

    <div class="hw-container">
      <div class="hw-btns">
        <div class="hw hw-c" onclick="sfxClick()">&#x25B6;</div>
        <div class="hw hw-b" onclick="sfxClick()">OK</div>
        <div class="hw hw-a" onclick="sfxClick()">&#x25C0;</div>
      </div>
      <div class="hw-labels">
        <div class="hw-lbl">&#x05D4;&#x05D1;&#x05D0;</div>
        <div class="hw-lbl">&#x05D0;&#x05D9;&#x05E9;&#x05D5;&#x05E8;</div>
        <div class="hw-lbl">&#x05D7;&#x05D6;&#x05D5;&#x05E8;</div>
      </div>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
  var navigating = false;
  function goStudent() {
    if (navigating) return;
    navigating = true;
    sfxClick();
    document.getElementById('btnStudent').style.opacity = '0.5';
    document.getElementById('btnStudent').textContent = '\u05D8\u05D5\u05E2\u05DF...';
    window.location.href = 'student.html';
  }
  function goTeacher() {
    if (navigating) return;
    navigating = true;
    sfxClick();
    document.getElementById('btnTeacher').style.opacity = '0.5';
    document.getElementById('btnTeacher').textContent = '\u05D8\u05D5\u05E2\u05DF...';
    window.location.href = 'teacher.html';
  }
</script>
</body>
</html>

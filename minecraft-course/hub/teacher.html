<title>מודים למיינקראפט · מדריך</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Secular+One&family=JetBrains+Mono:wght@500&display=swap">
<div id="app" dir="rtl" lang="he"></div>
<script src="content.js"></script>
<script src="slides.js"></script>
<script>
(function(){
"use strict";
const H = window.HUB, LS = H.LS, esc = H.esc;
let deckN = 1, SLIDES = H.DECKS[1];
H.injectStyle(document);
const app = document.getElementById("app");

/* ===== TEACHER AREA ===== */
// The next lesson to teach. Change NEXT when a lesson is done.
const NEXT = 2;
const PLAN = {
  1: [["0–15","מתקינים מהדיסק",""],["15–20","מה נעשה בקורס",""],["20–32","Diagon Alley, ומה למדנו",""],["32–65","מה עולם צריך?",""],["65–80","דף 1",""],["80–90","מיינקראפט נפתח",""]],
  2: [["0–5","מיינקראפט בתלת־ממד","קוביות שנשברות, יצורים, יום ולילה, השער"],["5–22","עולמות","בונים יחד את העולם של הכיתה"],["22–40","חפצים","Mojang, תפקיד, מחיר, נדירות, והחפץ של הכיתה"],
      ["40–52","דף 2","כרטיס וציור 16 על 16, עם שעון"],["52–60","הדגמה","החפץ של הכיתה, מהדף למשחק"],["60–85","הם בונים","בסטודיו: חפץ וציור, ובודקים במשחק"],["85–90","דרייב, ו״מה הוא עושה?״",""]]
};
const PART_COL = ["#3B8735","#2B6A99","#C98A0C","#8932B8","#B23A27","#169C9C","#56645A"];
function deckPictures(n){ const set = new Set(); (H.DECKS[n] || []).forEach(s => (s.html.match(/mc_[a-z0-9_]+\.png/g) || []).forEach(x => set.add(x))); return [...set]; }
function renderTeacher(){
  const L = H.LESSONS[NEXT], plan = PLAN[NEXT] || [];
  const mins = r => { const m = r[0].split("–").map(Number); return m[1] - m[0]; };
  app.innerHTML = `<div class="wrap tch">
    <div class="top"><div class="brand"><h1>אזור מדריך</h1><p>מודים למיינקראפט</p></div>
      <div class="tools"><a class="btn ghost" href="print.html" target="_blank">דפים להדפסה</a></div></div>

    <section class="next">
      <div class="nh"><div><small>השיעור הבא</small><h2>${esc(L.title)}</h2></div><a class="btn go big" href="#present${NEXT}">להתחיל להציג ←</a></div>
      <div class="tl">${plan.map((r, i) => `<div style="flex:${mins(r)};--c:${PART_COL[i % PART_COL.length]}"><b>${r[1]}</b><small>${r[0]} דק׳</small>${r[2] ? `<span>${r[2]}</span>` : ""}</div>`).join("")}</div>
    </section>

    <section class="tsec"><h2>לפני השיעור: דקה אחת</h2><div class="chk">
      <div class="ck" id="ck-hub"><i></i><div><b>הדף פתוח מהסמל Minecraft</b><small>בלי זה הסרטונים לא מתנגנים בתוך השקופית.</small></div></div>
      <div class="ck" id="ck-pics"><i></i><div><b>התמונות של מיינקראפט</b><small>בודקים…</small></div></div>
      <div class="ck" id="ck-yt"><i></i><div><b>יוטיוב פתוח ברשת של בית הספר</b><small>בודקים…</small></div></div>
      <div class="ck man"><i></i><div><b>המקרן</b><small><kbd>Win</kbd> + <kbd>P</kbd> ← <b>Extend</b>: ההערות אצלך, השקופית על המקרן (״פתיחת חלון למקרן״). אם המקרן רק משכפל את המסך: ״מסך מלא כאן״ (או <kbd>F</kbd>), ואז הכיתה רואה רק את השקופית, ואת ההערות לא.</small></div></div>
      <div class="ck man"><i></i><div><b>דף 2 מודפס, אחד לכל ילד, וטושים</b><small><a href="print.html" target="_blank">דפים להדפסה</a></small></div></div>
      <div class="ck man"><i></i><div><b>הסטודיו עובד אצלך: חפץ ניסיון נכנס למשחק</b><small>להדגמה בדקה 52. אם המשחק לא נפתח: ״לסגור את מיינקראפט״ ואז שוב ״שחק״.</small></div></div>
    </div></section>

    <section class="tsec"><h2>כל השיעורים</h2><div class="lessons">
      ${Object.keys(H.DECKS).map(n => `<div class="ls ${+n === NEXT ? "cur" : ""}"><small>שיעור ${n}</small><b>${esc(H.LESSONS[n] ? H.LESSONS[n].title.replace(/^שיעור \d+: /, "") : "")}</b><span>${H.DECKS[n].length} שקופיות${+n < NEXT ? " · הסתיים" : ""}</span><a class="btn ${+n === NEXT ? "go" : "ghost"}" href="#present${n}">הצגה</a></div>`).join("")}
    </div></section>

    <section class="tsec"><h2>לוח הכיתה</h2>
      <p>מה שהכיתה כתבה בשקופיות: העולם של הכיתה והחפץ של הכיתה. נשמר במחשב הזה, ומופיע בכל שקופית שמשתמשת בו.</p>
      <div class="bview">${[["idea","העולם"],["like","כמו"],["except","חוץ מזה ש"],["rule","החוק"],["conseq","ולכן"],["mystery","התעלומה"],["iname","החפץ"],["ilore","המשפט"],["iprice","המחיר"]].map(([k, t]) => `<div><small>${t}</small><span>${esc(board[k] || "—")}</span></div>`).join("")}</div>
      <div><button class="btn ghost" id="bclear">לנקות את הלוח (לכיתה חדשה)</button></div>
    </section>

    <details class="tsec"><summary><h2>מקשים בהצגה</h2></summary>
      <ul><li>חצים או רווח: השקופית הבאה או הקודמת.</li><li><kbd>F</kbd>: מסך מלא על המחשב שלך. <kbd>Esc</kbd>: חזרה להערות.</li>
      <li>קוביות ויצורים: גוררים כדי לסובב. לחיצה על קובייה שוברת אותה.</li><li>כרטיסים: לחיצה הופכת. הצבעה: לחיצה לכל יד, לחיצה ימנית מורידה.</li>
      <li>שורה ירוקה: לוחצים ומקלידים. <kbd>Enter</kbd> מסיים.</li><li>שעון: לחיצה מפעילה ועוצרת. ״איפוס שקופית״ מחזיר הכול בשקופית להתחלה.</li></ul></details>

    <details class="tsec"><summary><h2>ג׳מיני בקורס</h2></summary>
      <p>הילדים בונים בסטודיו בלי קוד. ג׳מיני הוא רק שותף: בסטודיו, בלשונית <b>ג׳מיני</b>, יש שני כפתורים.</p>
      <ul><li><b>רעיונות:</b> מעתיק את החוקים של הסטודיו ואת העולם של הילד. ג׳מיני שואל שאלות ולא ממציא בשבילו. אם הילד ביקש שינוי, ג׳מיני שולח אותו בבלוק קטן, והסטודיו בודק אותו לפני שהילד מקבל.</li>
      <li><b>בדיקת הבלוקים:</b> הילד כותב במילים שלו מה החפץ אמור לעשות. ג׳מיני בודק אם הבלוקים עושים את זה, ומציע גרסה מתוקנת. הילד רואה ״עכשיו״ ו״אחרי״, ומחליט.</li></ul>
      <p>החוקים נשלחים עם כל הודעה, בצ׳אט רגיל, בכל חשבון. בלי Gem: גוגל מחליפה את ה־Gems ב־Skills ב־17 בנובמבר 2026, ו־Skills מיועדים רק לבני 18 ומעלה.</p></details>

    <details class="tsec"><summary><h2>יום ההתקנה מחדש</h2></summary>
      <ol><li>במחשב שלך: לוחצים פעמיים על <code>C:\MAKE\update.bat</code>. בודקים חפץ אחד מהסטודיו במשחק.</li>
      <li>במחשב שלך: <code>make-usb</code> מעתיק את ההתקנה לדיסק און קי.</li>
      <li>בכל מחשב של ילד: <code>install-from-usb</code> מהדיסק. העבודה של הילד לא נמחקת.</li>
      <li>בפעם הראשונה שהילד פותח את Minecraft מתפריט Start, הוא בוחר קוד של 4 ספרות. שכח? ״שכחתי את הקוד״ וקוד המורה.</li></ol></details>

    <details class="tsec"><summary><h2>קבצים</h2></summary>
      <ul>
        <li><code>minecraft-course/setup/install.bat</code>: התקנה מהאינטרנט, על המחשב שלך</li>
        <li><code>make-usb.bat</code>: מעתיק את <code>C:\\MAKE</code> לדיסק (בלי הדף הזה)</li>
        <li><code>install-from-usb.bat</code>: הילדים מתקינים מהדיסק</li>
        <li><code>update-hub.ps1</code>: מעדכן את הדפים ואת התמונות במחשב שלך</li>
      </ul></details>
  </div>`;
  H.bindCopy(app);
  app.querySelector("#bclear").addEventListener("click", () => { if (!confirm("לנקות את כל מה שהכיתה כתבה?")) return; Object.keys(board).forEach(k => delete board[k]); LS.set("board", board); renderTeacher(); });
  runChecks();
}
function mark(id, ok, text){ const el = document.getElementById(id); if (!el) return; el.classList.toggle("ok", ok === true); el.classList.toggle("bad", ok === false); if (text) el.querySelector("small").innerHTML = text; }
function runChecks(){
  fetch("/api/status", { cache:"no-store" }).then(r => r.json()).then(() => mark("ck-hub", true, "הכול טוב.")).catch(() => mark("ck-hub", false, "לוחצים פעמיים על הסמל Minecraft (בתפריט Start), ואז פותחים שוב את הדף הזה."));
  const pics = deckPictures(NEXT); let ok = 0, done = 0, miss = [];
  pics.forEach(f => { const im = new Image(); im.onload = () => { ok++; fin(); }; im.onerror = () => { miss.push(f.replace(/^mc_|\.png$/g, "")); fin(); }; im.src = f; });
  function fin(){ if (++done < pics.length) return; mark("ck-pics", ok === pics.length, ok === pics.length ? `${ok} מתוך ${pics.length}.` : `${ok} מתוך ${pics.length}. חסרות: ${miss.slice(0, 6).join(", ")}${miss.length > 6 ? "…" : ""}. מריצים את שורת העדכון שוב, ואם עדיין חסר, שולחים ל־Claude את השמות.`); }
  if (!pics.length) mark("ck-pics", true, "אין תמונות בשיעור הזה.");
  const yt = new Image(); const t = setTimeout(() => mark("ck-yt", false, "לא נטען. אם יוטיוב חסום, מדלגים על הסרטון: השקופית שאחריו אומרת את אותו דבר."), 6000);
  yt.onload = () => { clearTimeout(t); mark("ck-yt", true, "נטען."); }; yt.onerror = () => { clearTimeout(t); mark("ck-yt", false, "לא נטען. אם יוטיוב חסום, מדלגים על הסרטון: השקופית שאחריו אומרת את אותו דבר."); };
  yt.src = "https://i.ytimg.com/vi/UlVZgIdoR_A/default.jpg?" + Date.now();
}

/* ===== PRESENTER CONSOLE ===== */
let sIx = LS.get("slide1", 0), aud = null, blocked = false, t0 = Date.now(), tick = null, playing = false, fs = null;
// Interactive slides (slides.js): the state of each deck, and the class board shared by all decks.
const ST = window.STAGE;
let ctx = LS.get("stage1", {});
const board = LS.get("board", {});
function roots(){ return [document.getElementById("cur"), audOpen() ? aud.document.getElementById("s") : null, fs ? fs.querySelector(".slide") : null].filter(Boolean); }
function changed(kind){
  LS.set("stage" + deckN, ctx); if (kind === "board") LS.set("board", board);
  if (ST) roots().forEach(r => ST.apply(r, ctx, board));
}
function stage(root, interactive){ if (!ST || !root) return; ST.apply(root, ctx, board); if (interactive) ST.bind(root, ctx, board, changed); }
const SERVED = location.protocol !== "file:";   // YouTube will not play embedded in a file:// page
// Opened from the desktop icon (a file)? If the hub's local server is running, continue there, so the video can be embedded.
if (!SERVED) fetch("http://localhost:47811/teacher.html", { mode:"no-cors" }).then(() => location.replace("http://localhost:47811/teacher.html" + location.hash)).catch(() => {});
const revealed = new Set();

function audOpen(){ return aud && !aud.closed; }
function openAudience(){
  const w = window.open("", "mkmod-audience", "popup,width=1280,height=720");
  if (!w){ blocked = true; renderConsole(); return; }
  blocked = false; aud = w;
  const d = w.document;
  d.open();
  d.write('<!doctype html><html lang="he" dir="rtl" data-theme="light"><head><meta charset="utf-8"><base href="' + location.href.replace(/[#?].*$/, "") + '"><title>מודים למיינקראפט</title></head><body class="aud"><div class="stage"><div class="slide" id="s"></div></div><p class="aud-hint">לחיצה כפולה: מסך מלא</p></body></html>');
  d.close();
  const l = d.createElement("link"); l.rel = "stylesheet"; l.href = H.FONT_HREF; d.head.appendChild(l);
  H.injectStyle(d);
  d.addEventListener("keydown", onKey);
  d.addEventListener("dblclick", () => { try{ (d.fullscreenElement ? d.exitFullscreen() : d.documentElement.requestFullscreen()).catch(()=>{}); }catch(e){} });
  syncAudience(); renderConsole();
}
function syncAudience(){
  if (!audOpen()) return;
  const s = aud.document.getElementById("s"); if (!s) return;
  s.innerHTML = SLIDES[sIx].html;
  H.applyReveal(s, revealed);
  s.querySelectorAll("[data-yt]").forEach(v => {
    v.innerHTML = SERVED ? ytFrame(v) : `<span class="play">▶</span>`;
  });
  stage(s, false);
}
const ytFrame = v => `<iframe src="https://www.youtube.com/embed/${v.dataset.yt}?rel=0&autoplay=${playing ? 1 : 0}${v.dataset.start ? "&start=" + v.dataset.start : ""}${v.dataset.end ? "&end=" + v.dataset.end : ""}" allow="autoplay; fullscreen; encrypted-media" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
const fmt = ms => { const t = Math.floor(ms/1000); return String(Math.floor(t/60)).padStart(2,"0") + ":" + String(t%60).padStart(2,"0"); };

function renderConsole(){
  const N = SLIDES.length; sIx = Math.max(0, Math.min(N-1, sIx));
  const S = SLIDES[sIx], next = SLIDES[sIx+1];
  app.innerHTML = `<div class="con">
    <div class="prbar"><div class="r"><a class="btn ghost" href="#teacher">→ אזור מדריך</a><b>${esc(H.LESSONS[deckN].title)}</b></div>
      <div class="r">
        ${audOpen() ? `<span class="aud-on">המקרן מחובר</span>` : `<button class="btn go" id="openaud">פתיחת חלון למקרן</button>`}
        <span class="timer" id="timer" title="זמן מתחילת השיעור">${fmt(Date.now()-t0)}</span>
        <button class="btn ghost" id="treset">איפוס שעון</button>
        <button class="btn ghost" id="sreset" title="מחזיר את השקופית הזאת להתחלה: הצבעות, כרטיסים הפוכים, סיבובים">איפוס שקופית</button>
        <button class="btn go" id="fson" title="השקופית על כל המסך של המחשב שלך. Esc חוזר">מסך מלא כאן</button>
        <span class="chip gold">${sIx+1} / ${N}</span>
      </div></div>
    ${blocked ? `<div style="padding:16px 16px 0"><div class="con-warn">הדפדפן חסם את החלון. מאשרים חלונות קופצים לדף הזה (סמל בשורת הכתובת) ולוחצים שוב.</div></div>` : ""}
    <main class="con-main">
      <section class="con-box live"><div class="con-label"><span>על המקרן עכשיו</span><span>${S.label}</span></div>
        <div class="stage"><div class="slide" id="cur">${S.html}</div></div></section>
      <div class="con-side">
        <section class="con-box"><div class="con-label"><span>הערות למדריך</span><span>רק אצלך</span></div><div class="con-notes">${S.notes}</div></section>
        <section class="con-box"><div class="con-label"><span>השקופית הבאה</span></div>
          <div class="con-next">${next ? `<b>${next.label}</b><small>${esc(next.notes.slice(0,90))}…</small>` : `<b>סוף השיעור</b>`}</div></section>
        <section class="con-box"><div class="con-label"><span>כל השקופיות</span></div>
          <div class="map" style="padding:10px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr))">${SLIDES.map((x,i)=>`<button data-s="${i}" class="${i===sIx?"cur":""}"><small>${i+1}</small><b>${x.label}</b></button>`).join("")}</div></section>
      </div>
    </main>
    <div class="prfoot"><button class="btn ghost" id="pp" ${sIx===0?"disabled":""}>→ הקודם</button><small>חצים או רווח להחלפת שקופית · בשקופית ״מי זה?״ לוחצים כאן על ריבוע כדי לחשוף אותו גם במקרן</small><button class="btn go" id="pn" ${sIx===N-1?"disabled":""}>הבא ←</button></div>
  </div>`;
  const cur = app.querySelector("#cur");
  H.applyReveal(cur, revealed);
  cur.querySelectorAll("[data-sil]").forEach(b => b.addEventListener("click", () => { revealed.add(+b.dataset.sil); H.applyReveal(cur, revealed); syncAudience(); }));
  cur.querySelectorAll("[data-yt]").forEach(v => {
    const url = "https://www.youtube.com/watch?v=" + v.dataset.yt + (v.dataset.start ? "&t=" + v.dataset.start : "");
    v.innerHTML = SERVED
      ? `<button class="btn go" id="vplay">${playing ? "■ לעצור" : "▶ לנגן במקרן"}</button><small>הסרטון מתנגן בחלון של המקרן. אפשר גם ללחוץ עליו שם.</small>`
      : `<button class="btn go" id="vwin">▶ לפתוח את הסרטון בחלון</button><small>כדי שהסרטון יהיה בתוך השקופית: לוחצים פעמיים על הסמל Minecraft, ואז פותחים שוב את הדף הזה</small>`;
    const vp = v.querySelector("#vplay"), vw = v.querySelector("#vwin");
    if (vp) vp.addEventListener("click", () => { playing = !playing; if (!audOpen()) openAudience(); else syncAudience(); renderConsole(); });
    if (vw) vw.addEventListener("click", () => window.open(url, "mkmod-video", "popup,width=1280,height=720"));
  });
  stage(cur, true);
  const oa = app.querySelector("#openaud"); if (oa) oa.addEventListener("click", openAudience);
  app.querySelector("#sreset").addEventListener("click", resetSlide);
  app.querySelector("#fson").addEventListener("click", openFs);
  app.querySelector("#treset").addEventListener("click", () => { t0 = Date.now(); app.querySelector("#timer").textContent = "00:00"; });
  app.querySelector("#pp").addEventListener("click", () => goSlide(sIx-1));
  app.querySelector("#pn").addEventListener("click", () => goSlide(sIx+1));
  app.querySelectorAll("[data-s]").forEach(b => b.addEventListener("click", () => goSlide(+b.dataset.s)));
  clearInterval(tick);
  tick = setInterval(() => { const el = document.getElementById("timer"); if (el) el.textContent = fmt(Date.now()-t0); if (aud && aud.closed){ aud = null; renderConsole(); } }, 1000);
}
function goSlide(i){ playing = false; sIx = Math.max(0, Math.min(SLIDES.length-1, i)); LS.set("slide" + deckN, sIx); renderConsole(); syncAudience(); if (fs) renderFs(); }
// Clears what was clicked on this slide (the class board stays).
function resetSlide(){
  const tmp = document.createElement("div"); tmp.innerHTML = SLIDES[sIx].html;
  tmp.querySelectorAll("[data-id]").forEach(el => { const id = el.dataset.id; ["rot","rv","vt","tm","dn","pt","hb","so","zm"].forEach(k => { if (ctx[k]) delete ctx[k][id]; }); });
  tmp.querySelectorAll("[data-mine]").forEach(el => { if (ctx.mine) delete ctx.mine[el.dataset.mine]; });
  changed("reset"); renderConsole(); syncAudience(); if (fs) renderFs();
}
/* Full screen on the laptop itself: when the projector only mirrors the laptop's screen, this is what the class sees.
   Everything on the slide is clickable here. Arrows change slides, Esc goes back to the notes. */
function openFs(){
  fs = document.createElement("div"); fs.className = "fsv";
  document.body.appendChild(fs); renderFs();
  try { fs.requestFullscreen().catch(() => {}); } catch(e){}
}
function renderFs(){
  if (!fs) return;
  fs.innerHTML = `<div class="stage"><div class="slide">${SLIDES[sIx].html}</div></div><div class="fsbar"><span>${sIx+1} / ${SLIDES.length} · ${esc(SLIDES[sIx].label)}</span><span>חצים: שקופית · Esc: חזרה להערות</span><button class="btn ghost" id="fsoff">יציאה</button></div>`;
  const sl = fs.querySelector(".slide");
  H.applyReveal(sl, revealed);
  sl.querySelectorAll("[data-sil]").forEach(b => b.addEventListener("click", () => { revealed.add(+b.dataset.sil); H.applyReveal(sl, revealed); syncAudience(); }));
  sl.querySelectorAll("[data-yt]").forEach(v => { v.innerHTML = SERVED ? ytFrame(v) : `<button class="btn go">▶ לפתוח את הסרטון בחלון</button>`;
    const b = v.querySelector("button"); if (b) b.addEventListener("click", () => window.open("https://www.youtube.com/watch?v=" + v.dataset.yt + (v.dataset.start ? "&t=" + v.dataset.start : ""), "mkmod-video", "popup,width=1280,height=720")); });
  stage(sl, true);
  fs.querySelector("#fsoff").addEventListener("click", closeFs);
}
function closeFs(){ if (!fs) return; fs.remove(); fs = null; try { if (document.fullscreenElement) document.exitFullscreen(); } catch(e){} renderConsole(); }
document.addEventListener("fullscreenchange", () => { if (fs && !document.fullscreenElement) closeFs(); });
setInterval(() => { if (ST) roots().forEach(r => ST.tick(r, ctx)); }, 250);
function deckFromHash(){ const m = location.hash.match(/^#present(\d+)$/); return m && H.DECKS[+m[1]] ? +m[1] : 0; }
function onKey(e){
  if (!deckFromHash()) return;
  if (e.target && ((e.target.matches && e.target.matches("input,textarea,select")) || e.target.isContentEditable)) return;
  if (e.key === "Escape" && fs){ closeFs(); return; }
  if ((e.key === "f" || e.key === "F") && !fs){ openFs(); return; }
  if (["ArrowLeft"," ","PageDown"].includes(e.key)){ e.preventDefault(); goSlide(sIx+1); }
  if (["ArrowRight","PageUp"].includes(e.key)){ e.preventDefault(); goSlide(sIx-1); }
}

/* ===== router ===== */
function route(){
  const dn = deckFromHash();
  if (dn) { if (dn !== deckN) { deckN = dn; SLIDES = H.DECKS[dn]; sIx = LS.get("slide" + dn, 0); ctx = LS.get("stage" + dn, {}); revealed.clear(); } renderConsole(); syncAudience(); }
  else { clearInterval(tick); renderTeacher(); }
}
window.addEventListener("hashchange", route);
document.addEventListener("keydown", onKey);
route();
})();
</script>

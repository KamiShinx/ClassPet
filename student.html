<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ClassPet - &#x05EA;&#x05DC;&#x05DE;&#x05D9;&#x05D3;</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&family=Secular+One&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="egg-wrapper">
  <div class="ring"></div>
  <div class="shell">
    <div class="brand">CLASS-PET</div>

    <div class="bezel">
      <div class="lcd">
        <div class="lcd-vignette"></div>
        <div class="lcd-scanline"></div>

        <!-- Status bar -->
        <div class="lcd-status" id="statusBar" style="display:none;">
          <span class="status-name" id="sName" onclick="confirmLogout()" style="cursor:pointer;text-decoration:underline;"></span>
          <span class="status-level" id="sLevel"></span>
          <span class="status-coins" id="sCoins"></span>
          <span class="status-stars" id="sStars"></span>
        </div>

        <div class="lcd-body" id="lcdBody">

          <!-- LOGIN: NAME PICKER -->
          <div class="panel active" id="p-login">
            <div style="text-align:center;padding:15px 10px;">
              <div style="font-size:3rem;margin-bottom:8px;">&#x1F423;</div>
              <div style="font-family:'Secular One',sans-serif;font-size:1.2rem;color:var(--lcd-dark);margin-bottom:4px;">&#x05D1;&#x05D7;&#x05E8; &#x05D0;&#x05EA; &#x05D4;&#x05E9;&#x05DD; &#x05E9;&#x05DC;&#x05DA;</div>
              <div style="font-size:0.8rem;color:var(--lcd-mid);margin-bottom:10px;">&#x05DC;&#x05D7;&#x05E5; &#x05E2;&#x05DC; &#x05D4;&#x05E9;&#x05DD; &#x05E9;&#x05DC;&#x05DA; &#x05DB;&#x05D3;&#x05D9; &#x05DC;&#x05D4;&#x05EA;&#x05D7;&#x05D9;&#x05DC;</div>
            </div>
            <div class="name-list" id="nameList">
              <div class="loading">&#x05D8;&#x05D5;&#x05E2;&#x05DF;</div>
            </div>
          </div>

          <!-- LOGIN: PIN PAD -->
          <div class="panel" id="p-student-pin">
            <div style="text-align:center;padding:15px 10px;">
              <div style="font-size:2.5rem;margin-bottom:6px;">&#x1F512;</div>
              <div style="font-family:'Secular One',sans-serif;font-size:1.1rem;color:var(--lcd-dark);margin-bottom:2px;" id="pinWelcome"></div>
              <div style="font-size:0.8rem;color:var(--lcd-mid);margin-bottom:4px;">&#x05D4;&#x05DB;&#x05E0;&#x05E1; &#x05E1;&#x05D9;&#x05E1;&#x05DE;&#x05D4;</div>
            </div>
            <div class="pin-display" id="studentPinDisplay">____</div>
            <div class="pin-pad">
              <div class="pin-key" onclick="studentPinKey('1')">1</div>
              <div class="pin-key" onclick="studentPinKey('2')">2</div>
              <div class="pin-key" onclick="studentPinKey('3')">3</div>
              <div class="pin-key" onclick="studentPinKey('4')">4</div>
              <div class="pin-key" onclick="studentPinKey('5')">5</div>
              <div class="pin-key" onclick="studentPinKey('6')">6</div>
              <div class="pin-key" onclick="studentPinKey('7')">7</div>
              <div class="pin-key" onclick="studentPinKey('8')">8</div>
              <div class="pin-key" onclick="studentPinKey('9')">9</div>
              <div class="pin-key" onclick="studentPinClear()" style="font-size:0.8rem;">&#x2190;</div>
              <div class="pin-key" onclick="studentPinKey('0')">0</div>
              <div class="pin-key" onclick="studentPinSubmit()" style="background:var(--candy-yellow);font-size:0.8rem;">OK</div>
            </div>
            <div style="text-align:center;margin-top:8px;">
              <span style="color:var(--egg);cursor:pointer;font-weight:700;font-size:0.75rem;" onclick="backToNamePicker()">&#x25C0; &#x05D7;&#x05D6;&#x05E8;&#x05D4; &#x05DC;&#x05E8;&#x05E9;&#x05D9;&#x05DE;&#x05D4;</span>
            </div>
          </div>

          <!-- PET PANEL -->
          <div class="panel" id="p-pet">
            <div id="petContainer" style="width:100%;flex:1;position:relative;"></div>
          </div>

          <!-- RATE PANEL -->
          <div class="panel" id="p-rate">
            <div id="lessonList" style="width:100%;flex:1;overflow-y:auto;padding:8px;">
              <div class="loading">&#x05D8;&#x05D5;&#x05E2;&#x05DF;</div>
            </div>
            <div id="ratingScreen" style="display:none;width:100%;flex:1;overflow-y:auto;">
              <div style="text-align:center;padding:8px;font-family:'Secular One',sans-serif;font-size:0.9rem;color:var(--lcd-dark);border-bottom:2px dashed var(--lcd-mid);" id="ratingLesson"></div>
              <div class="emo-grid" id="emoGrid"></div>
              <div style="text-align:center;padding:8px;">
                <div class="big-btn yellow" onclick="submitRating()">&#x05E9;&#x05DC;&#x05D7; &#x05D3;&#x05D9;&#x05E8;&#x05D5;&#x05D2; &#x2705;</div>
              </div>
            </div>
          </div>

          <!-- SHOP PANEL -->
          <div class="panel" id="p-shop">
            <div style="display:flex;width:100%;padding:6px 8px;gap:6px;">
              <div class="big-btn yellow" style="flex:1;padding:6px;font-size:0.8rem;" onclick="showShopView()" id="btnShop">&#x1F6D2; &#x05D7;&#x05E0;&#x05D5;&#x05EA;</div>
              <div class="big-btn blue" style="flex:1;padding:6px;font-size:0.8rem;" onclick="showClosetView()" id="btnCloset">&#x1F457; &#x05D0;&#x05E8;&#x05D5;&#x05DF;</div>
            </div>
            <div id="shopContent" style="width:100%;flex:1;overflow-y:auto;"></div>
          </div>

          <!-- STATS PANEL -->
          <div class="panel" id="p-stats">
            <div style="width:100%;padding:12px;text-align:center;">
              <div style="font-family:'Secular One',sans-serif;font-size:1.1rem;color:var(--lcd-dark);margin-bottom:12px;">&#x1F4CA; &#x05E1;&#x05D8;&#x05D8;&#x05D9;&#x05E1;&#x05D8;&#x05D9;&#x05E7;&#x05D4;</div>
              <div id="statsContent"></div>
            </div>
          </div>
        </div>

        <!-- Bottom nav -->
        <div class="bottom-nav" id="bottomNav" style="display:none;">
          <div class="nav-tab active" data-tab="p-pet" onclick="switchTab(this)">
            <span class="nav-tab-icon">&#x1F95A;</span>
            &#x05D4;&#x05E4;&#x05D8; &#x05E9;&#x05DC;&#x05D9;
          </div>
          <div class="nav-tab" data-tab="p-rate" onclick="switchTab(this)">
            <span class="nav-tab-icon">&#x2B50;</span>
            &#x05D3;&#x05E8;&#x05D2; &#x05E9;&#x05D9;&#x05E2;&#x05D5;&#x05E8;
          </div>
          <div class="nav-tab" data-tab="p-shop" onclick="switchTab(this)">
            <span class="nav-tab-icon">&#x1F6D2;</span>
            &#x05D7;&#x05E0;&#x05D5;&#x05EA;
          </div>
          <div class="nav-tab" data-tab="p-stats" onclick="switchTab(this)">
            <span class="nav-tab-icon">&#x1F4CA;</span>
            &#x05E1;&#x05D8;&#x05D8;&#x05D9;&#x05E1;&#x05D8;&#x05D9;&#x05E7;&#x05D4;
          </div>
        </div>
      </div>
    </div>

    <div class="hw-container">
      <div class="hw-btns">
        <div class="hw hw-c" onclick="hwRight()">&#x25B6;</div>
        <div class="hw hw-b" onclick="hwOk()">OK</div>
        <div class="hw hw-a" onclick="hwLeft()">&#x25C0;</div>
      </div>
      <div class="hw-labels">
        <div class="hw-lbl">&#x05D4;&#x05D1;&#x05D0;</div>
        <div class="hw-lbl">&#x05D0;&#x05D9;&#x05E9;&#x05D5;&#x05E8;</div>
        <div class="hw-lbl">&#x05D7;&#x05D6;&#x05D5;&#x05E8;</div>
      </div>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script src="pet-render.js"></script>
<script>
/* ============================================================
   Student Panel Logic
   ============================================================ */

var state = null;
var shopItems = null;
var currentLessonId = null;
var currentTab = 'p-pet';

var emotions = [
  { text:'\u05D4\u05E4\u05EA\u05D9\u05E2 \u05D0\u05D5\u05EA\u05D9 \uD83E\uDD2F',   hex:'1f92f', score:2 },
  { text:'\u05D2\u05D9\u05DC\u05D9\u05EA\u05D9 \u05DE\u05DC\u05D0 \uD83D\uDCA1',     hex:'1f4a1', score:1 },
  { text:'\u05E8\u05D5\u05E6\u05D4 \u05E2\u05D5\u05D3 \u2728',                       hex:'2728',  score:2 },
  { text:'\u05E0\u05D4\u05E0\u05D9\u05EA\u05D9 \u05D1\u05D8\u05D9\u05E8\u05D5\u05E3 \uD83E\uDD29', hex:'1f929', score:2 },
  { text:'\u05D4\u05DC\u05DB\u05EA\u05D9 \u05DC\u05D0\u05D9\u05D1\u05D5\u05D3 \uD83D\uDE35',       hex:'1f635', score:-1 },
  { text:'\u05D4\u05D9\u05D4 \u05E8\u05D2\u05D9\u05DC \uD83D\uDE10',                                hex:'1f610', score:0 },
  { text:'\u05D4\u05D9\u05D4 \u05E7\u05E9\u05D4 \uD83E\uDD75',                                      hex:'1f975', score:-1 },
  { text:'\u05E9\u05E2\u05DE\u05DD \u05D0\u05D5\u05EA\u05D9 \uD83E\uDD71',                          hex:'1f971', score:-2 }
];

// ---- Init ----
var pendingStudentId = null;
var pendingStudentName = null;
var studentPin = '';
var busy = false;

(function init() {
  var session = getSession();
  if (session && session.student_id) {
    loadStudentState(session.student_id, session.password);
  } else {
    loadRoster();
  }
})();

function loadRoster() {
  api('getRoster').then(function(roster) {
    var list = document.getElementById('nameList');
    if (!roster || roster.length === 0) {
      list.innerHTML = '<div class="empty-state">\u05D0\u05D9\u05DF \u05EA\u05DC\u05DE\u05D9\u05D3\u05D9\u05DD \u05E2\u05D3\u05D9\u05D9\u05DF</div>';
      return;
    }
    list.innerHTML = roster.map(function(s) {
      return '<div class="name-item" onclick="pickStudent(\'' + s.id + '\',\'' + escHtml(s.name) + '\')">' + escHtml(s.name) + '</div>';
    }).join('');
  }).catch(function(err) {
    document.getElementById('nameList').innerHTML = '<div class="empty-state">\u05E9\u05D2\u05D9\u05D0\u05D4: ' + escHtml(err.message) + '</div>';
  });
}

function pickStudent(id, name) {
  if (busy) return;
  sfxSelect();
  pendingStudentId = id;
  pendingStudentName = name;
  studentPin = '';
  document.getElementById('pinWelcome').textContent = '\u05E9\u05DC\u05D5\u05DD ' + name + '!';
  updateStudentPinDisplay();
  showPanel('p-login', false);
  showPanel('p-student-pin', true);
}

function studentPinKey(d) {
  if (busy) return;
  sfxClick();
  if (studentPin.length >= 4) return;
  studentPin += d;
  updateStudentPinDisplay();
  if (studentPin.length === 4) setTimeout(studentPinSubmit, 200);
}

function studentPinClear() {
  if (busy) return;
  sfxClick();
  studentPin = studentPin.slice(0, -1);
  updateStudentPinDisplay();
}

function studentPinSubmit() {
  if (!studentPin || busy) return;
  busy = true;
  document.getElementById('studentPinDisplay').textContent = '\u05D8\u05D5\u05E2\u05DF...';
  document.querySelectorAll('#p-student-pin .pin-key').forEach(function(k) { k.style.opacity = '0.5'; });
  loadStudentState(pendingStudentId, studentPin);
}

function updateStudentPinDisplay() {
  var display = '';
  for (var i = 0; i < 4; i++) display += i < studentPin.length ? '\u25CF' : '_';
  document.getElementById('studentPinDisplay').textContent = display;
}

function backToNamePicker() {
  sfxClick();
  studentPin = '';
  pendingStudentId = null;
  pendingStudentName = null;
  showPanel('p-student-pin', false);
  showPanel('p-login', true);
}

function loadStudentState(studentId, password) {
  api('loginStudent', { student_id: studentId, password: password }).then(function(s) {
    state = s;
    busy = false;
    setSession({ student_id: studentId, password: password, name: s.name });
    document.querySelectorAll('#p-student-pin .pin-key').forEach(function(k) { k.style.opacity = '1'; });
    showPanel('p-student-pin', false);
    enterApp();
  }).catch(function(err) {
    busy = false;
    document.querySelectorAll('#p-student-pin .pin-key').forEach(function(k) { k.style.opacity = '1'; });
    if (err.message === 'Wrong password') {
      sfxError();
      showToast('\u05E1\u05D9\u05E1\u05DE\u05D4 \u05E9\u05D2\u05D5\u05D9\u05D4!', true);
      studentPin = '';
      updateStudentPinDisplay();
    } else {
      clearSession();
      showToast('\u05E9\u05D2\u05D9\u05D0\u05D4: ' + err.message, true);
      showPanel('p-student-pin', false);
      showPanel('p-login', true);
      loadRoster();
    }
  });
}

function enterApp() {
  document.getElementById('statusBar').style.display = 'flex';
  document.getElementById('bottomNav').style.display = 'flex';
  updateStatusBar();
  showPanel('p-login', false);
  showPanel('p-pet', true);
  document.querySelectorAll('.nav-tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelector('[data-tab="p-pet"]').classList.add('active');
  currentTab = 'p-pet';
  renderPet();
  sfxSuccess();
}

function updateStatusBar() {
  if (!state) return;
  document.getElementById('sName').textContent = state.name;
  document.getElementById('sLevel').innerHTML = '\uD83C\uDF96\uFE0F ' + state.level;
  document.getElementById('sCoins').innerHTML = '\uD83E\uDE99 ' + state.coins;
  document.getElementById('sStars').innerHTML = '\u2B50 ' + state.stars;
}

function renderPet() {
  if (!state) return;
  var container = document.getElementById('petContainer');
  if (shopItems) {
    renderPetView(container, state, shopItems);
  } else {
    api('getShop', { student_id: state.id }).then(function(items) {
      shopItems = items;
      renderPetView(container, state, shopItems);
    }).catch(function() {
      renderPetView(container, state, []);
    });
  }
}

// ---- Tab switching ----
function switchTab(el) {
  sfxClick();
  var tab = el.dataset.tab;
  currentTab = tab;
  document.querySelectorAll('.nav-tab').forEach(function(t) { t.classList.remove('active'); });
  el.classList.add('active');
  document.querySelectorAll('#lcdBody > .panel').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById(tab).classList.add('active');
  if (tab === 'p-rate') loadOpenLessons();
  if (tab === 'p-shop') loadShop();
  if (tab === 'p-stats') loadStats();
  if (tab === 'p-pet') renderPet();
}

// ---- Rating flow ----
function loadOpenLessons() {
  var list = document.getElementById('lessonList');
  var screen = document.getElementById('ratingScreen');
  screen.style.display = 'none';
  list.style.display = 'block';
  list.innerHTML = '<div class="loading">\u05D8\u05D5\u05E2\u05DF</div>';
  api('getOpenLessons', { student_id: state.id }).then(function(lessons) {
    if (!lessons || lessons.length === 0) {
      list.innerHTML = '<div class="empty-state" style="padding:30px;">\uD83C\uDF31 \u05D0\u05D9\u05DF \u05E9\u05D9\u05E2\u05D5\u05E8\u05D9\u05DD \u05DC\u05D3\u05E8\u05D2 \u05DB\u05E8\u05D2\u05E2</div>';
      return;
    }
    list.innerHTML = lessons.map(function(l) {
      return '<div class="name-item" onclick="openRating(\'' + l.id + '\',\'' + escHtml(l.topic) + '\')">' +
        '<div style="font-size:0.75rem;color:var(--lcd-mid);">' + l.date + '</div>' +
        escHtml(l.topic) + '</div>';
    }).join('');
  }).catch(function(err) {
    list.innerHTML = '<div class="empty-state">\u05E9\u05D2\u05D9\u05D0\u05D4: ' + escHtml(err.message) + '</div>';
  });
}

function openRating(lessonId, topic) {
  sfxClick();
  currentLessonId = lessonId;
  document.getElementById('lessonList').style.display = 'none';
  document.getElementById('ratingScreen').style.display = 'flex';
  document.getElementById('ratingLesson').textContent = topic;
  var grid = document.getElementById('emoGrid');
  grid.innerHTML = emotions.map(function(e) {
    var emoji = e.text.split(' ').pop();
    return '<div class="emo" data-text="' + e.text + '" onclick="togEmo(this)">' +
      '<div class="e-icon"><img src="https://fonts.gstatic.com/s/e/notoemoji/latest/' + e.hex + '/512.webp" alt="" class="anim-emo" onerror="this.outerHTML=\'<span class=native-emoji>' + emoji + '</span>\'"></div>' +
      '<span class="e-txt">' + e.text + '</span></div>';
  }).join('');
}

function togEmo(el) {
  sfxSelect();
  el.classList.toggle('sel');
  if (el.classList.contains('sel')) spark(el);
}

function spark(el) {
  var s = document.createElement('div');
  s.className = 'spark';
  s.textContent = '\u2728';
  s.style.cssText = 'left:' + (Math.random()*60+20) + '%;top:-10%;font-size:1.2rem;';
  el.appendChild(s);
  setTimeout(function() { s.remove(); }, 1000);
}

function submitRating() {
  if (busy) return;
  var selected = document.querySelectorAll('#emoGrid .emo.sel');
  if (selected.length === 0) { showToast('\u05D1\u05D7\u05E8 \u05DC\u05E4\u05D7\u05D5\u05EA \u05E8\u05D2\u05E9 \u05D0\u05D7\u05D3!', true); sfxError(); return; }
  busy = true;
  var emotionTexts = [];
  selected.forEach(function(el) { emotionTexts.push(el.dataset.text); });
  sfxClick();
  showToast('\u05E9\u05D5\u05DC\u05D7...');
  api('submitRating', { student_id: state.id, lesson_id: currentLessonId, emotions: emotionTexts }).then(function(newState) {
    busy = false; state = newState;
    updateStatusBar();
    sfxSuccess(); sfxCoin(); petJumpAnimation();
    showToast('\u05D3\u05D9\u05E8\u05D5\u05D2 \u05E0\u05E9\u05DC\u05D7! \uD83C\uDF89');
    setTimeout(function() { loadOpenLessons(); }, 1500);
  }).catch(function(err) { busy = false; showToast('\u05E9\u05D2\u05D9\u05D0\u05D4: ' + err.message, true); sfxError(); });
}

// ---- Shop ----
var shopView = 'shop';

function loadShop() {
  shopView = 'shop'; updateShopButtons();
  var content = document.getElementById('shopContent');
  content.innerHTML = '<div class="loading">\u05D8\u05D5\u05E2\u05DF</div>';
  api('getShop', { student_id: state.id }).then(function(items) {
    shopItems = items;
    renderShopGrid(items);
  }).catch(function(err) { content.innerHTML = '<div class="empty-state">\u05E9\u05D2\u05D9\u05D0\u05D4: ' + escHtml(err.message) + '</div>'; });
}

function showShopView() { sfxClick(); shopView = 'shop'; updateShopButtons(); if (shopItems) renderShopGrid(shopItems); }
function showClosetView() { sfxClick(); shopView = 'closet'; updateShopButtons(); if (shopItems) renderCloset(shopItems); }
function updateShopButtons() {
  document.getElementById('btnShop').style.opacity = shopView === 'shop' ? '1' : '0.5';
  document.getElementById('btnCloset').style.opacity = shopView === 'closet' ? '1' : '0.5';
}

function renderShopGrid(items) {
  var content = document.getElementById('shopContent');
  content.innerHTML = '<div class="shop-grid">' + items.map(function(item) {
    var statusClass, statusText;
    if (item.owned) { statusClass = 'own'; statusText = '\u05D9\u05E9 \u05DC\u05D9 \u2705'; }
    else if (!item.level_ok) { statusClass = 'lock'; statusText = '\uD83D\uDD12 \u05E8\u05DE\u05D4 ' + item.required_level; }
    else if (!item.affordable) { statusClass = 'lock'; statusText = '\u05D0\u05D9\u05DF \u05DE\u05E1\u05E4\u05D9\u05E7 \u05DE\u05D8\u05D1\u05E2\u05D5\u05EA'; }
    else { statusClass = 'buy'; statusText = '\u05E7\u05E0\u05D4!'; }
    var cardClass = item.owned ? 'owned' : (!item.level_ok ? 'locked' : '');
    var onclick = (!item.owned && item.level_ok && item.affordable) ? ' onclick="buyItem(\'' + item.id + '\')"' : '';
    return '<div class="shop-card ' + cardClass + '"' + onclick + '>' +
      '<div class="shop-card-emoji">' + (item.emoji || '') + '</div>' +
      '<div class="shop-card-name">' + escHtml(item.name_he) + '</div>' +
      '<div class="shop-card-price">\uD83E\uDE99 ' + item.price_coins + '</div>' +
      '<div class="shop-card-status ' + statusClass + '">' + statusText + '</div></div>';
  }).join('') + '</div>';
}

function renderCloset(items) {
  var content = document.getElementById('shopContent');
  var owned = items.filter(function(i) { return i.owned; });
  if (owned.length === 0) { content.innerHTML = '<div class="empty-state" style="padding:30px;">\u05E2\u05D3\u05D9\u05D9\u05DF \u05D0\u05D9\u05DF \u05DC\u05DA \u05E4\u05E8\u05D9\u05D8\u05D9\u05DD \uD83D\uDED2</div>'; return; }
  var equipped = state.equipped_items || [];
  content.innerHTML = '<div class="closet-list">' + owned.map(function(item) {
    var isOn = equipped.indexOf(item.id) !== -1;
    return '<div class="closet-item"><div class="closet-item-info"><span style="font-size:1.5rem;">' + (item.emoji || '') + '</span><span style="font-weight:700;font-size:0.85rem;">' + escHtml(item.name_he) + '</span></div>' +
      '<div class="closet-toggle ' + (isOn ? 'on' : '') + '" onclick="toggleEquip(\'' + item.id + '\',' + !isOn + ')"></div></div>';
  }).join('') + '</div>';
}

function buyItem(itemId) {
  if (busy) return;
  busy = true;
  sfxClick(); showToast('\u05E7\u05D5\u05E0\u05D4...');
  api('buyItem', { student_id: state.id, item_id: itemId }).then(function(newState) {
    busy = false; state = newState; updateStatusBar(); sfxSuccess(); sfxCoin();
    showToast('\u05E0\u05E7\u05E0\u05D4! \uD83C\uDF89'); loadShop();
  }).catch(function(err) { busy = false; showToast('\u05E9\u05D2\u05D9\u05D0\u05D4: ' + err.message, true); sfxError(); });
}

function toggleEquip(itemId, equip) {
  sfxClick();
  api('equipItem', { student_id: state.id, item_id: itemId, equipped: equip }).then(function(newState) {
    state = newState; updateStatusBar(); if (shopItems) renderCloset(shopItems); sfxSelect();
  }).catch(function(err) { showToast('\u05E9\u05D2\u05D9\u05D0\u05D4: ' + err.message, true); });
}

// ---- Stats ----
function loadStats() {
  if (!state) return;
  var sc = document.getElementById('statsContent');
  var levelProgress = (state.stars % 100);
  sc.innerHTML =
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px;">' +
      '<div style="background:#fff;border:2px solid var(--lcd-dark);border-radius:8px;padding:10px;text-align:center;">' +
        '<div style="font-size:1.8rem;">\uD83E\uDE99</div>' +
        '<div style="font-family:\'Secular One\',sans-serif;font-size:1.3rem;color:var(--lcd-dark);">' + state.coins + '</div>' +
        '<div style="font-size:0.7rem;color:var(--lcd-mid);">\u05DE\u05D8\u05D1\u05E2\u05D5\u05EA</div></div>' +
      '<div style="background:#fff;border:2px solid var(--lcd-dark);border-radius:8px;padding:10px;text-align:center;">' +
        '<div style="font-size:1.8rem;">\u2B50</div>' +
        '<div style="font-family:\'Secular One\',sans-serif;font-size:1.3rem;color:var(--lcd-dark);">' + state.stars + '</div>' +
        '<div style="font-size:0.7rem;color:var(--lcd-mid);">\u05DB\u05D5\u05DB\u05D1\u05D9\u05DD</div></div></div>' +
    '<div style="background:#fff;border:2px solid var(--lcd-dark);border-radius:8px;padding:10px;margin-bottom:10px;">' +
      '<div style="font-family:\'Secular One\',sans-serif;font-size:0.9rem;color:var(--lcd-dark);margin-bottom:6px;">\uD83C\uDF96\uFE0F \u05E8\u05DE\u05D4 ' + state.level + '</div>' +
      '<div style="background:var(--lcd-mid);border-radius:4px;height:12px;overflow:hidden;">' +
        '<div style="background:var(--sel-bg);height:100%;width:' + levelProgress + '%;transition:width 0.5s;border-radius:4px;"></div></div>' +
      '<div style="font-size:0.65rem;color:var(--lcd-mid);margin-top:2px;">' + levelProgress + '/100 \u05DC\u05E8\u05DE\u05D4 \u05D4\u05D1\u05D0\u05D4</div></div>' +
    '<div style="background:#fff;border:2px solid var(--lcd-dark);border-radius:8px;padding:10px;">' +
      '<div style="font-family:\'Secular One\',sans-serif;font-size:0.9rem;color:var(--lcd-dark);">\u05D3\u05D9\u05E8\u05D5\u05D2\u05D9\u05DD: ' + state.ratings_count + '</div></div>' +
    '<div style="margin-top:15px;text-align:center;">' +
      '<span style="color:var(--egg);cursor:pointer;font-weight:700;font-size:0.8rem;" onclick="logout()">\uD83D\uDEAA \u05D4\u05EA\u05E0\u05EA\u05E7\u05D5\u05EA</span></div>';
}

function confirmLogout() {
  sfxClick();
  if (confirm('\u05DC\u05D4\u05EA\u05E0\u05EA\u05E7 \u05D5\u05DC\u05D4\u05D7\u05DC\u05D9\u05E3 \u05DE\u05E9\u05EA\u05DE\u05E9?')) {
    logout();
  }
}

function logout() {
  sfxClick(); clearSession(); state = null; shopItems = null;
  document.getElementById('statusBar').style.display = 'none';
  document.getElementById('bottomNav').style.display = 'none';
  document.querySelectorAll('#lcdBody > .panel').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById('p-login').classList.add('active');
  loadRoster();
}

// ---- Hardware buttons ----
function hwLeft() {
  sfxClick();
  var tabs = ['p-pet','p-rate','p-shop','p-stats'];
  var idx = tabs.indexOf(currentTab);
  if (idx > 0) { var el = document.querySelector('[data-tab="' + tabs[idx-1] + '"]'); if (el) switchTab(el); }
}
function hwRight() {
  sfxClick();
  var tabs = ['p-pet','p-rate','p-shop','p-stats'];
  var idx = tabs.indexOf(currentTab);
  if (idx < tabs.length-1) { var el = document.querySelector('[data-tab="' + tabs[idx+1] + '"]'); if (el) switchTab(el); }
}
function hwOk() { sfxClick(); }
</script>
</body>
